<!doctype html>
<html lang="ru">
<head>

<body class="sk">
  <header class="topbar sk-bar">

      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8.5 6v12h3a6 6 0 0 0 0-12z"/></svg></span>

    </div>
    <nav class="sk-top-links">
      <a class="top-btn link" data-href="/planner" href="/ru/planner"><span data-t="planner">Планировщик</span></a>
      <a class="top-btn link" data-href="" href="/ru"><span data-t="building">Новостройка</span></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ru">RU</button>
      <button data-lang="uz">UZ</button>
      <button data-lang="en">EN</button>

    <button type="button" class="theme-btn" data-theme-toggle aria-label="Theme"><svg class="t-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/></svg><svg class="t-sun" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

    <div class="sk-progress" aria-hidden="true"><i id="skProgress"></i></div>

  <nav class="sk-nav" id="skNav" aria-label="Chapters"></nav>

  <main class="sk-main" id="skMain">
    <section class="sk-hero" id="hero">
      <div class="sk-hero-text">
        <div class="sk-kicker sk-rv" data-t="hero.kicker">Stack</div>
        <h2 class="sk-hero-title sk-rv" data-th="hero.title">Как устроен Domus</h2>
        <p class="sk-hero-sub sk-rv" data-t="hero.sub"></p>
        <div class="sk-stats sk-rv">
          <div><b data-count="967">967</b><span data-t="hero.s1"></span></div>
          <div><b data-count="92">92</b><span data-t="hero.s2"></span></div>
          <div><b data-count="19">19</b><span data-t="hero.s3"></span></div>
          <div><b data-count="3">3</b><span data-t="hero.s4"></span></div>
        </div>
      </div>
      <div class="sk-hero-art" id="heroArt" aria-hidden="true"></div>
      <a class="sk-scroll" href="#c1"><span data-t="hero.scroll"></span><i></i></a>

    <div id="skChapters"></div>
