<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Domus — Stack</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body { height: auto; min-height: 100%; }
    .sk-gate { flex: 1; display: grid; place-items: center; padding: 48px 16px; }
    .sk-card { width: min(380px, 100%); padding: 34px 30px 28px; border: 1px solid var(--hairline); border-radius: var(--r-l);
      background: var(--card-bg); box-shadow: var(--sh-2); animation: sk-rise .8s var(--ease) both; }
    .sk-kicker { font: 700 10px/1 var(--f-ui); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
    .sk-card h2 { font: 500 34px/1.1 var(--f-display); margin: 12px 0 6px; }
    .sk-card p { color: var(--muted); margin: 0 0 22px; }
    .sk-card label { display: block; font: 600 11px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 14px 0 7px; }
    .sk-card input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: var(--r-m); border: 1px solid var(--line-2);
      background: var(--input-bg); color: var(--text); font: 15px var(--f-ui); }
    .sk-card input:focus { outline: none; border-color: var(--gold); }
    .sk-card button[type=submit] { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: var(--r-m); cursor: pointer;
      background: var(--btn-primary-bg); color: var(--btn-primary-ink); box-shadow: var(--sh-primary); font: 700 12px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; }
    .sk-card button[disabled] { opacity: .6; cursor: wait; }
    .sk-err { min-height: 20px; margin-top: 12px; color: var(--danger); font-size: 13px; }
    .sk-top-links { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .sk-top-links .top-btn { margin: 0; }
    @keyframes sk-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .sk-card { animation: none; } }
    @media (max-width: 640px) { .sk-top-links .top-btn span { display: inline; } .sk-top-links .top-btn { padding: 6px 7px; letter-spacing: .06em; } }
  </style>
  <script type="module" src="/js/stack-login.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8.5 6v12h3a6 6 0 0 0 0-12z"/></svg></span>
      <div class="brand-text"><h1>Domus</h1><span class="byline">by Askar</span></div>
    </div>
    <nav class="sk-top-links">
      <a class="top-btn link" data-href="/planner" href="/ru/planner"><span data-t="planner">Планировщик</span></a>
      <a class="top-btn link" data-href="" href="/ru"><span data-t="building">Новостройка</span></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ru">RU</button>
      <button data-lang="uz">UZ</button>
      <button data-lang="en">EN</button>
    </div>
    <button type="button" class="theme-btn" data-theme-toggle aria-label="Theme"><svg class="t-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/></svg><svg class="t-sun" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>
  <main class="sk-gate">
    <form class="sk-card" id="skLogin" autocomplete="on">
      <div class="sk-kicker">Stack</div>
      <h2 data-t="title">Как устроен Domus</h2>
      <p data-t="sub">Закрытая страница. Введите логин и пароль.</p>
      <label for="skUser" data-t="login">Логин</label>
      <input id="skUser" name="username" autocomplete="username" required maxlength="100">
      <label for="skPass" data-t="password">Пароль</label>
      <input id="skPass" name="password" type="password" autocomplete="current-password" required maxlength="200">
      <button type="submit" data-t="enter">Войти</button>
      <div class="sk-err" id="skErr" role="alert"></div>
    </form>
  </main>
</body>
</html>
