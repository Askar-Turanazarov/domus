<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Chinor Park — бронь</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('fsp3d.theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/booking.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8.5 6v12h3a6 6 0 0 0 0-12z"/></svg></span>
      <div class="brand-text"><h1 id="bkTitle" data-i18n="bk.page.brand">Chinor Park</h1><span class="byline">by Askar</span></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ru">RU</button>
      <button data-lang="uz">UZ</button>
      <button data-lang="en">EN</button>
    </div>
    <button type="button" class="theme-btn" data-theme-toggle data-i18n-title="theme.toggle" aria-label="Theme"><svg class="t-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/></svg><svg class="t-sun" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <div class="bkp-net" id="bkNet" hidden role="status" data-i18n="bk.page.offline">Нет соединения</div>

  <main class="bkp">
    <p class="bkp-loading" id="bkLoading" data-i18n="bk.page.loading">Загружаем бронь…</p>
    <section class="bkp-card" id="bkInvalid" hidden>
      <h2 data-i18n="bk.page.invalid">Ссылка недействительна</h2>
      <p class="hint" data-i18n="bk.page.invalidNote"></p>
      <a class="btn" id="bkInvalidBack" href="/" data-i18n="bk.page.back">К витрине дома</a>
    </section>
    <section class="bkp-card" id="bkFail" hidden>
      <p id="bkFailText" class="bkp-err"></p>
      <button type="button" class="btn" id="bkRetry" data-i18n="bk.page.continue">Продолжить</button>
    </section>
    <div id="bkBody" hidden></div>
    <footer class="site-foot in-main"><span class="sf-name">Domus</span><span class="sf-tag" data-i18n="brand.tagline">квартиры и мебель в 3D</span><span class="sf-sep" aria-hidden="true"></span><span class="sf-by">by Askar</span><span class="sf-year">© 2026</span></footer>
  </main>

  <dialog id="bkAsk">
    <h2 id="bkAskText"></h2>
    <div class="bkp-row end">
      <button type="button" class="btn" id="bkAskNo"></button>
      <button type="button" class="btn danger" id="bkAskYes"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/js/booking.js"></script>
</body>
</html>
