<body class="bld-page">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8.5 6v12h3a6 6 0 0 0 0-12z"/></svg></span>
      <div class="brand-text"><h1 id="bldName" data-i18n="bld.title">Chinor Park</h1><span class="byline">by Askar</span></div>
    </div>
    <a class="top-btn link" href="/index.html" data-lang-href="/planner">📐 <span data-i18n="bld.back">Планировщик</span></a>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ru">RU</button>
      <button data-lang="uz">UZ</button>
      <button data-lang="en">EN</button>
    </div>
    <button type="button" class="theme-btn" data-theme-toggle data-i18n-title="theme.toggle" aria-label="Theme"><svg class="t-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/></svg><svg class="t-sun" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <main class="bld">
    <aside class="bld-side">
      <section class="card bld-filters">
        <h2 data-i18n="bld.filters">Подбор квартиры</h2>
        <div class="bld-f-row"><span data-i18n="bld.rooms">Комнат</span><div class="seg" id="fRooms"></div></div>
        <div class="bld-f-row"><span data-i18n="bld.area">Площадь, м²</span>
          <span class="bld-range"><input type="number" id="fAreaMin" min="0" step="1" inputmode="numeric"> –
            <input type="number" id="fAreaMax" min="0" step="1" inputmode="numeric"></span></div>
        <div class="bld-f-row"><span data-i18n="bld.priceMax">Цена до, млн сум</span>
          <input type="number" id="fPrice" min="0" step="10" inputmode="numeric"></div>
        <label class="bld-check"><input type="checkbox" id="fFree"> <span data-i18n="bld.freeOnly">Только свободные</span></label>
        <p class="hint" id="fFound"></p>
      </section>
      <section class="card bld-facade-card">
        <h2 data-i18n="bld.floors">Этажи</h2>
        <div class="bld-facade" id="bldFacade"></div>
        <div class="bld-legend" id="bldLegendSt"></div>
        <p class="bld-live-stale" id="liveStale" role="status" hidden></p>
      </section>
    </aside>

    <div class="bld-right">
    <section class="card bld-3d" id="bld3dCard">
      <div class="bld3d-view" id="bld3dView">
        <div class="bld3d-hud">
          <div class="seg" role="group" id="bld3dTime">
            <button type="button" data-time="day">☀</button>
            <button type="button" data-time="evening">🌇</button>
            <button type="button" data-time="night">🌙</button>
          </div>
          <button type="button" class="hud-btn active" id="bld3dOrbit" data-i18n-title="bld3d.orbitTitle">⟳ <span data-i18n="bld3d.orbit">Облёт</span></button>
          <button type="button" class="hud-btn" id="bld3dWalk" data-i18n-title="bld3d.walkTitle">🚶 <span data-i18n="bld3d.walk">Прогулка от улицы</span></button>
          <button type="button" class="hud-btn" id="bld3dTint" data-i18n-title="bld3d.tintTitle">🎨 <span data-i18n="bld3d.tint">Подсветка</span></button>
          <button type="button" class="hud-btn" id="bld3dPhoto" hidden>📷 <span id="bld3dPhotoText"></span></button>
        </div>
        <div class="bld-tip" id="bld3dTip" hidden></div>
        <div class="bld3d-cue" id="bld3dCue" role="status" hidden><span class="bld3d-cue-arrow" id="bld3dCueArrow">⬆</span><span id="bld3dCueText"></span></div>
        <div class="bld-hero" id="bldHero">
          <span class="bld-hero-kicker" data-i18n="bld.heroKicker">Жилой комплекс</span>
          <b class="bld-hero-title" id="bldHeroName"></b>
          <span class="bld-hero-sub" data-i18n="bld.heroSub">Планировки, свободные квартиры и прогулка в 3D</span>
          <span class="bld-hero-acts"><button type="button" class="btn primary" id="bldHeroPick" data-i18n="bld.heroPick">Выбрать квартиру</button>
            <button type="button" class="btn" id="bldHeroWalk" data-i18n="bld3d.walk">Прогулка от улицы</button></span>
        </div>
        <p class="bld3d-hint" id="bld3dHint"></p>
        <div class="bld3d-pad" id="bld3dPad" hidden>
          <button type="button" data-f="1" aria-label="Forward">▲</button>
          <button type="button" data-f="-1" aria-label="Back">▼</button>
        </div>
      </div>
    </section>
    <section class="card bld-main">
      <div class="bld-head">
        <button type="button" class="btn icon" id="floorDown" aria-label="Floor down">▼</button>
        <h2 id="floorTitle"></h2>
        <button type="button" class="btn icon" id="floorUp" aria-label="Floor up">▲</button>
        <span class="bld-spacer"></span>
        <span class="hint" data-i18n="bld.colorBy">Цвет</span>
        <div class="seg" id="colorBy">
          <button type="button" data-by="status" data-i18n="bld.byStatus">Статус</button>
          <button type="button" data-by="rooms" data-i18n="bld.byRooms">Комнаты</button>
        </div>
      </div>
      <div class="bld-plan-wrap" id="planWrap">
        <canvas id="bldPlan"></canvas>
        <div class="bld-tip" id="bldTip" hidden></div>
      </div>
      <div class="bld-legend" id="bldLegend"></div>
      <p class="hint" data-i18n="bld.hint">Наведите на квартиру — подсказка, клик — карточка</p>
    </section>
    </div>
    <footer class="site-foot in-main"><span class="sf-name">Domus</span><span class="sf-tag" data-i18n="brand.tagline">квартиры и мебель в 3D</span><span class="sf-sep" aria-hidden="true"></span><span class="sf-by">by Askar</span><span class="sf-year">© 2026</span></footer>
  </main>

  <dialog id="aptDlg" class="wide bld-dlg">
    <div class="dlg-head">
      <h2 id="aptTitle"></h2>
      <button type="button" class="btn icon ghost" id="aptClose" aria-label="Close">✕</button>
    </div>
    <div class="bld-card">
      <canvas id="aptPlan"></canvas>
      <div class="bld-info">
        <dl class="bld-meta" id="aptMeta"></dl>
        <table class="bld-rooms" id="aptRooms"></table>
        <p class="bld-mine" id="aptMine" hidden></p>
        <div class="btn-row">
          <button type="button" class="btn" id="apt3d" data-i18n="bld.walk3d">🚶 Пройтись в 3D</button>
          <button type="button" class="btn" id="aptPlanner" data-i18n="bld.openPlanner">📐 Открыть в планировщике</button>
          <a class="btn primary" id="aptContinue" data-i18n="bk.hold.continue" href="#" hidden>Продолжить оплату</a>
          <button type="button" class="btn primary" id="aptBook" data-i18n="bk.hold.open" hidden>🏠 Забронировать</button>
          <button type="button" class="btn" id="aptRequest" data-i18n="bld.request">✉ Оставить заявку</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="floor3dDlg" class="wide bld-dlg floor3d-dlg">
    <div class="dlg-head">
      <h2 id="floor3dTitle"></h2>
      <button type="button" class="btn icon ghost" id="floor3dClose" aria-label="Close">✕</button>
    </div>
    <div class="floor3d-box">
      <iframe id="floor3dFrame" class="floor3d-frame" allow="fullscreen" title="3D"></iframe>
      <div class="floor3d-load" id="floor3dLoad" role="status" hidden><span class="spinner"></span><span id="floor3dLoadText"></span></div>
    </div>
  </dialog>

  <dialog id="reqDlg">
    <form id="reqForm" method="dialog">
      <h2 id="reqTitle"></h2>
      <label class="row"><span data-i18n="order.name">Имя</span>
        <input name="name" required maxlength="100" autocomplete="name"></label>
      <label class="row"><span data-i18n="order.phone">Телефон</span>
        <input name="phone" type="tel" required maxlength="30" placeholder="+998 __ ___ __ __" autocomplete="tel"></label>
      <label class="row"><span data-i18n="order.comment">Комментарий</span>
        <textarea name="comment" rows="3" maxlength="1000"></textarea></label>
      <!-- Honeypot for bots: hidden from people and screen readers -->
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="btn-row end">
        <button type="button" class="btn ghost" id="reqCancel" data-i18n="order.cancel">Отмена</button>
        <button type="submit" class="btn primary" data-i18n="order.send">Отправить</button>
      </div>
    </form>
  </dialog>

  <dialog id="holdDlg">
    <form id="holdForm" method="dialog" novalidate>
      <h2 id="holdTitle"></h2>
      <p class="hold-sum" id="holdSum"></p>
      <label class="row"><span data-i18n="order.name">Имя</span>
        <input name="name" required minlength="2" maxlength="60" autocomplete="name"></label>
      <label class="row"><span data-i18n="order.phone">Телефон</span>
        <input name="phone" type="tel" required maxlength="30" placeholder="+998 __ ___ __ __" autocomplete="tel"></label>
      <label class="check"><input type="checkbox" name="offer"><span id="holdOffer"></span></label>
      <label class="check"><input type="checkbox" name="privacy"><span id="holdPrivacy"></span></label>
      <!-- Honeypot for bots: hidden from people and screen readers -->
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="hold-err" id="holdErr" role="alert"></p>
      <div class="btn-row end">
        <button type="button" class="btn ghost" id="holdCancel" data-i18n="bk.hold.cancel">Отмена</button>
        <button type="submit" class="btn primary" id="holdGo" data-i18n="bk.hold.submit" disabled>Оформить и перейти к оплате</button>
      </div>
      <p class="hint hold-note" id="holdNote"></p>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/js/mini.js"></script>
  <script type="module" src="/js/buildingPage.js"></script>
</body>
