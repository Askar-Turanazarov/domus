<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Журнал вызовов — менеджер</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('fsp3d.theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <script>try{if(localStorage.getItem('fsp3d.adm'))document.documentElement.dataset.adm='in'}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-text"><h1 data-i18n="cl.title">Журнал вызовов</h1><span class="byline">by Askar</span></div></div>
    <div class="top-actions">
      <a class="btn ghost" href="/admin.html" data-i18n="bk.orders">Заявки на мебель</a>
      <a class="btn ghost" href="/bookings.html" data-i18n="bk.toViewings">Заявки на показ</a>
      <button type="button" class="btn ghost" id="admLogout" hidden data-i18n="adm.logout">Выйти</button>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ru">RU</button>
        <button data-lang="uz">UZ</button>
        <button data-lang="en">EN</button>
      </div>
      <button type="button" class="theme-btn" data-theme-toggle data-i18n-title="theme.toggle" aria-label="Theme"><svg class="t-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/></svg><svg class="t-sun" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
  </header>

  <main class="adm">
    <form class="adm-card adm-login" id="admLogin">
      <h2 data-i18n="adm.loginTitle">Вход для менеджера</h2>
      <label class="row"><span data-i18n="adm.loginName">Логин</span>
        <input type="text" name="login" required maxlength="100" autocomplete="username"></label>
      <label class="row"><span data-i18n="adm.password">Пароль</span>
        <input type="password" name="password" required maxlength="200" autocomplete="current-password"></label>
      <p class="adm-err" id="admLoginErr"></p>
      <button type="submit" class="btn primary" data-i18n="adm.login">Войти</button>
    </form>

    <section class="adm-card" id="clList" hidden>
      <div class="adm-tools cl-stats" id="clStats" aria-live="polite"></div>
      <div class="adm-scroll" id="clTable">
        <table class="adm-table bk-table cl-table">
          <thead><tr>
            <th data-i18n="cl.time">Время</th><th data-i18n="cl.agent">Субагент</th><th data-i18n="cl.tool">Инструмент</th>
            <th data-i18n="cl.args">Параметры</th><th data-i18n="cl.result">Результат</th><th data-i18n="cl.ms">мс</th>
          </tr></thead>
          <tbody id="clRows"></tbody>
        </table>
      </div>
      <p class="adm-empty" id="clEmpty" hidden data-i18n="cl.empty">Вызовов пока нет</p>
    </section>
    <footer class="site-foot in-main"><span class="sf-name">Domus</span><span class="sf-tag" data-i18n="brand.tagline">квартиры и мебель в 3D</span><span class="sf-sep" aria-hidden="true"></span><span class="sf-by">by Askar</span><span class="sf-year">© 2026</span></footer>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/calls.js"></script>
</body>
</html>
