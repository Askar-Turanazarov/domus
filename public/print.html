<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чертёж и спецификация</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #e9ecef; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #212529; }
    .bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; background: #fff; border-bottom: 1px solid #dee2e6; }
    .bar button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid #ced4da; background: #fff; cursor: pointer; }
    .bar button.primary { background: #3b5bdb; border-color: #3b5bdb; color: #fff; }
    .sheet { background: #fff; max-width: 1100px; margin: 16px auto; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .sheet img { display: block; width: 100%; height: auto; }
    h2 { font-size: 16px; margin: 14px 0 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #adb5bd; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #f1f3f5; }
    td.num { text-align: right; white-space: nowrap; }
    .total { margin-top: 8px; font-weight: 700; }
    .note { color: #6b7280; font-size: 12px; }
    .empty { max-width: 600px; margin: 60px auto; text-align: center; color: #495057; }
    @page { size: A4 landscape; margin: 8mm; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { box-shadow: none; margin: 0; padding: 0; max-width: none; }
      .sheet + .sheet { break-before: page; }
      .spec { break-before: page; }
      img { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden>
    <button type="button" id="closeBtn"></button>
    <button type="button" class="primary" id="printBtn"></button>
  </div>
  <main id="pages"></main>
  <script src="/js/print.js"></script>
</body>
</html>
